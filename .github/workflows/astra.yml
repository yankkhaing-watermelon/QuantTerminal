name: Astra legacy trigger (shared scan)
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: false
        default: ""
      config:
        required: false
        default: "{}"
permissions:
  contents: read
jobs:
  shared:
    uses: ./.github/workflows/daily-quant.yml
    with:
      request_id: ${{ inputs.request_id }}
      config: ${{ inputs.config || '{}' }}
    secrets: inherit
