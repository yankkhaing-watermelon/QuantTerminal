name: Daily Quant and Astra Publication

on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "Legacy input; production always collects the complete Bursa universe"
        required: false
        default: "0"
      request_id:
        description: "Shared RUN identifier"
        required: false
        default: ""
      config:
        description: "Astra portfolio assumptions JSON"
        required: false
        default: "{}"
  workflow_call:
    inputs:
      request_id:
        type: string
        default: ""
      config:
        type: string
        default: "{}"
  schedule:
    - cron: "45 11 * * 1-5"

concurrency:
  group: daily-quant-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: One 300-bar scan for Quant, Wizard and Astra
        env:
          MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
          ASTRA_REQUEST_ID: ${{ inputs.request_id }}
          ASTRA_CONFIG: ${{ inputs.config || '{}' }}
          PORTFOLIO_SYMBOLS: ${{ vars.PORTFOLIO_SYMBOLS }}
          QUANT_API_BASE: ${{ secrets.QUANT_API_BASE }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: python scripts/run_shared.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-quant-astra-${{ github.run_id }}
          path: artifacts
          retention-days: 7
